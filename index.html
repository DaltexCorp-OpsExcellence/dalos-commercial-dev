<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DalOS Commercial</title>
<meta name="theme-color" content="#2f2a3d"/>
<!-- Browser-tab / bookmark identity: growth-pipeline mark on aubergine (DalOS Commercial brand). -->
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
<!-- Add-to-Home-Screen: DalOS Capture. Manifest start_url (#capture) makes the iOS icon relaunch
     into Show Mode; apple-* meta give standalone display + icon. -->
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="capture-icon-180.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="capture-icon-152.png"/>
<link rel="apple-touch-icon" sizes="167x167" href="capture-icon-167.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="capture-icon-180.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DalOS Capture"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── Palette: PEWTER — dimmed daylight (muted lavender-gray content, dark-violet
   sidebar, violet accent). Feeds boot/gate, html/body, and the QC-preview modals
   (which render outside .crmv). CRM island + sidebar via the .crmv.crmv block below. ── */
:root{
  --bg:#d9d6e0;--bg2:#cfccda;--bg3:#c4c1d1;
  --sidebar:#2f2a3d;--sidebar2:#3a3449;
  --sidebar-text:#d9d3ea;--sidebar-muted:#9a92b0;
  --accent:#7c4dff;--accent2:#6a3ded;
  --amber:#b7791f;--amber-bg:rgba(183,121,31,.15);--amber-border:rgba(183,121,31,.42);
  --red:#d64545;--red-bg:rgba(214,69,69,.14);--red-border:rgba(214,69,69,.42);
  --green:#1f9d55;--green-bg:rgba(31,157,85,.15);--green-border:rgba(31,157,85,.42);
  --text:#221f2b;--text2:#4c4757;--text3:#6f6a7c;
  --border:#c8c4d3;--border2:#b8b3c6;--card:#efedf4;
  --font-display:'DM Serif Display',serif;
  --font-body:'Instrument Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --sidebar-w:218px;
}
html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font-body);font-size:13px;color:var(--text)}

/* ── QC-preview modal support (ported verbatim from Vision) ── */
@keyframes dalos-spin{to{transform:rotate(360deg)}}
.dalos-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:dalos-spin .8s linear infinite;vertical-align:middle}
.cqc-two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cqc-two-col-bot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){ .cqc-two-col,.cqc-two-col-bot{grid-template-columns:1fr} }
/* Mobile: off-canvas sidebar + hamburger (desktop is unaffected) */
.cm-burger{display:none;position:fixed;top:calc(9px + env(safe-area-inset-top));left:9px;z-index:1001;width:40px;height:40px;align-items:center;justify-content:center;background:var(--sidebar);color:#fff;border:1px solid var(--sidebar2);border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.28);cursor:pointer;padding:0}
.cm-burger svg{width:20px;height:20px;display:block}
.cm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999}
@media(max-width:767px){
  /* crm.js hides .sidebar at ≤700px (its own standalone mobile layout) — the Commercial host
     needs it, so force it back with !important and slide it in/out off-canvas. */
  .crmv .sidebar{display:flex !important;position:fixed !important;left:0;top:0;bottom:0;height:100dvh !important;width:min(82vw,300px) !important;z-index:1000;transform:translateX(-100%) !important;transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.45)}
  .crmv .sidebar.mob-open{transform:translateX(0) !important}
  .cm-burger{display:flex}
  .cm-content{padding-top:calc(52px + env(safe-area-inset-top))}
}
/* CqcPreviewModal skeleton reuses this global keyframe (also defined by injectCrmCss) */
@keyframes dh-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── shared canonical staging badge (crm.js nav renders <span class="staging-badge">) ── */
.staging-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#ff6b35 0%,#f7c948 100%);color:#fff;padding:4px 12px 4px 9px;border-radius:20px;box-shadow:0 3px 14px rgba(255,107,53,.4);font-size:10px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase}

/* ── boot / gate screens ── */
/* Dark aubergine boot/gate — seamless with the pre-mount splash; the brand mark
   renders transparent (no tile box) so it reads as art, not a pasted-on square. */
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#463f57 0%,#2f2a3d 46%,#201c29 100%);padding:24px;text-align:center}
.boot-logo{font-family:var(--font-display);font-size:26px;color:#f4f1e8}
.boot-logo .os{color:#b9a6ff}
.boot-mark{width:58px;height:58px;display:block;filter:drop-shadow(0 6px 20px rgba(124,77,255,.38))}
.boot-mark svg{width:100%;height:100%;display:block}
/* Loading animation — the growth line traces in, nodes pop, the peak breathes.
   Scoped to the splash + boot mark so the static sidebar lockup is untouched. */
#cm-splash svg path,.boot-mark svg path{stroke-dasharray:58;animation:cm-trace 1.9s ease-in-out infinite}
#cm-splash svg>circle,.boot-mark svg>circle{transform-box:fill-box;transform-origin:center;animation:cm-peak 1.9s ease-in-out infinite}
#cm-splash svg g circle,.boot-mark svg g circle{transform-box:fill-box;transform-origin:center;animation:cm-pop 1.9s ease-in-out infinite}
@keyframes cm-trace{0%{stroke-dashoffset:58}45%{stroke-dashoffset:0}75%{stroke-dashoffset:0}100%{stroke-dashoffset:58}}
@keyframes cm-peak{0%,100%{opacity:.5;transform:scale(.75)}45%,75%{opacity:1;transform:scale(1.15)}}
@keyframes cm-pop{0%,100%{opacity:.35;transform:scale(.7)}45%,75%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#cm-splash svg path,.boot-mark svg path,#cm-splash svg circle,.boot-mark svg circle{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
/* Sidebar lockup mark (beside the DalOS Commercial wordmark) */
.crmv .logo-mark{width:32px;height:32px;flex:0 0 32px;display:block}
.crmv .logo-mark svg{width:100%;height:100%;display:block}
.boot-sub{font-size:12px;color:#9a92b0;letter-spacing:.04em}
.boot-spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.14);border-top-color:#b9a6ff;border-radius:50%;animation:dalos-spin .8s linear infinite}
.boot-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:26px 30px;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.boot-btn{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:8px;text-decoration:none}
.boot-btn:hover{background:var(--accent2)}
/* In-app sign-in gate (Show Mode PWA): email/password on the same shared session so the
   installed app opens straight into Show Mode instead of bouncing through Workspace. */
.boot-inp{width:100%;margin-top:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:11px 13px;color:#f4f1e8;font-size:16px;outline:none;text-align:left}
.boot-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,77,255,.25)}
.boot-inp::placeholder{color:#726a86}
.boot-inp:disabled{opacity:.6}
.boot-signin{width:100%;margin-top:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:12px;border:none;border-radius:9px;cursor:pointer}
.boot-signin:hover{background:var(--accent2)}
.boot-signin:disabled{opacity:.55;cursor:default}
.boot-err{margin-top:10px;color:#ff9d9d;font-size:12px;line-height:1.5}
.boot-forgot{display:inline-block;margin-top:12px;color:#b9a6ff;font-size:12px;text-decoration:none}
.boot-forgot:hover{text-decoration:underline}
.boot-ws{display:block;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);color:#8f86a8;font-size:11px;text-decoration:none}
.boot-ws:hover{color:#b9a6ff}

/* ═══════════════ PEWTER RESKIN of the CRM island ═══════════════
   crm.js is fully CSS-variable-driven, so we override its .crmv vars here rather
   than editing crm.js (kept byte-identical). Double-class .crmv.crmv beats the
   specificity/order of crm.js's injected .crmv{} block. Same palette as :root. */
.crmv.crmv{
  --bg:#d9d6e0;--bg2:#cfccda;--bg3:#c4c1d1;
  --sidebar:#2f2a3d;--sidebar2:#3a3449;
  --sidebar-text:#d9d3ea;--sidebar-muted:#9a92b0;
  --accent:#7c4dff;--accent2:#6a3ded;
  --amber:#b7791f;--amber-bg:rgba(183,121,31,.15);--amber-border:rgba(183,121,31,.42);
  --red:#d64545;--red-bg:rgba(214,69,69,.14);--red-border:rgba(214,69,69,.42);
  --green:#1f9d55;--green-bg:rgba(31,157,85,.15);--green-border:rgba(31,157,85,.42);
  --text:#221f2b;--text2:#4c4757;--text3:#6f6a7c;
  --border:#c8c4d3;--border2:#b8b3c6;--card:#efedf4;
}
/* consolidated Lead-Generation nav: Marketing/Sales sub-labels + My Work count badge */
.crmv .nav-sublabel{padding-top:8px;padding-bottom:3px;opacity:.9}
.crmv .nav-item .nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:10px;line-height:16px;min-width:16px;text-align:center;background:var(--accent);color:#fff;border-radius:9px;padding:0 6px}
.crmv .nav-item.active .nav-badge{background:rgba(255,255,255,.28);color:#fff}
/* Hardcoded-white Leads/Capture surfaces in crm.js → dark panels (var flip can't reach them) */
.crmv.crmv .ldp,.crmv.crmv .lc,.crmv.crmv .inb,.crmv.crmv .capbtn,.crmv.crmv .capchip,.crmv.crmv .cap-bt,.crmv.crmv .who{background:var(--card)}
.crmv.crmv .col-n{background:var(--bg3);color:var(--text2)}
.crmv.crmv .fbtn.active .fbtn-count{background:var(--accent);color:#fff}
.crmv.crmv .l-bulk .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* amber info banners: dark-amber text on a light amber tint */
.crmv.crmv .alert-warn{background:rgba(183,121,31,.12);border-color:rgba(183,121,31,.35);color:#8a5a12}
.crmv.crmv .l-draft{color:#8a5a12}

/* ── sidebar footer: Workspace button · user card · Sign out · version ── */
.crmv .cm-foot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.crmv .cm-ws{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:9px;background:transparent;border:1px solid var(--border2);color:var(--sidebar-text);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;text-align:left}
.crmv .cm-ws:hover{background:var(--sidebar2);border-color:color-mix(in srgb,var(--accent) 55%,var(--border2))}
.crmv .cm-ws-ic{display:inline-flex;align-items:center;flex-shrink:0}
.crmv .cm-ws svg{width:15px;height:15px;opacity:.78;flex-shrink:0}
.crmv .cm-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.crmv .cm-av{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em}
.crmv .cm-name{font-size:13px;font-weight:600;color:var(--sidebar-text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crmv .cm-role{font-size:11px;color:var(--sidebar-muted);margin-top:1px}
.crmv .cm-signout{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:9px;background:transparent;border:none;color:var(--sidebar-text);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:.15s;text-align:left}
.crmv .cm-signout:hover{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.crmv .cm-signout svg{width:14px;height:14px;opacity:.72;flex-shrink:0}
.crmv .cm-ver{font-size:10px;color:var(--sidebar-muted);padding:3px 4px 0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Season context bar: always shows which season is open; calm when active, amber when not ── */
.crmv .cm-seasonbar{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:12.5px;border-bottom:1px solid rgba(124,77,255,.2);flex-wrap:wrap;flex-shrink:0}
.crmv .cm-seasonbar svg{width:14px;height:14px;flex-shrink:0;opacity:.9}
.crmv .cm-seasonbar b{font-weight:700}
/* on-brand Pewter violet for the normal (active) state; Pewter amber caution when off-season */
.crmv .cm-seasonbar.is-active{background:rgba(124,77,255,.10);color:#4f2bb8;border-bottom-color:rgba(124,77,255,.28)}
.crmv .cm-seasonbar.is-off{background:rgba(183,121,31,.15);color:#8a5713;border-bottom-color:rgba(183,121,31,.42)}
.crmv .cm-season-pill{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:20px;color:#fff}
.crmv .cm-seasonbar.is-active .cm-season-pill{background:#7c4dff}
.crmv .cm-seasonbar.is-off .cm-season-pill{background:#b7791f}
.crmv .cm-season-sub{color:var(--text3);font-size:11px;opacity:.9}
.crmv .cm-season-switch{margin-left:auto;font-size:12px;font-weight:600;color:#6a3ded;background:#fff;border:1px solid rgba(124,77,255,.4);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap;font-family:var(--font-body)}
.crmv .cm-season-switch:hover{background:#f3efff;border-color:#7c4dff}
@media(max-width:700px){.crmv .cm-seasonbar{padding-left:58px}.crmv .cm-season-sub{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<!-- pre-mount splash: branded aubergine loading screen, shown instantly while React/supabase
     load and auth resolves; faded out by App once phase is ready/gate. -->
<div id="cm-splash" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#463f57 0%,#2f2a3d 46%,#201c29 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s ease">
  <div style="width:62px;height:62px;filter:drop-shadow(0 8px 22px rgba(124,77,255,.4))">
    <svg width="100%" height="100%" viewBox="4 4 56 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="DalOS Commercial"><path d="M11 44 L25 36 L37 40 L53 17" stroke="#c9b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#a98bff"><circle cx="11" cy="44" r="3"/><circle cx="25" cy="36" r="3"/><circle cx="37" cy="40" r="3"/></g><circle cx="53" cy="17" r="5.2" fill="#e2d7ff"/></svg>
  </div>
  <div style="font-family:'DM Serif Display',Georgia,serif;font-size:22px"><span style="color:#f4f1e8">Dal</span><span style="color:#b9a6ff">OS</span><span style="color:#f4f1e8"> Commercial</span></div>
  <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a92b0;font-family:'Instrument Sans',system-ui,sans-serif">Loading…</div>
</div>
<script type="text/javascript">
var useState = React.useState;
var ce = React.createElement;

/* ── Supabase client — IDENTICAL createClient call to Vision/Workspace so this app
   inherits the shared session (default storageKey sb-<ref>-auth-token) on the shared
   GitHub Pages origin. Do NOT pass a custom storageKey. Auth invariant: pinned
   supabase-js 2.110.8, no forced refreshSession, no idle-eject signOut here. ── */
var DALOS_SUPABASE_URL='https://sfyjvgjwvtwkrnqrvqyc.supabase.co';
var DALOS_SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeWp2Z2p3dnR3a3JucXJ2cXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NzIxNjYsImV4cCI6MjA5MDQ0ODE2Nn0.FjA75XZsp0Kx5Xam_rrnYoAHX4JHKey6vEFCH_zlMuQ';
var supabase = window.supabase.createClient(DALOS_SUPABASE_URL, DALOS_SUPABASE_ANON);

var WORKSPACE_URL=(/-dev|localhost|127\.0\.0\.1/.test(location.host+location.pathname)?'https://daltexcorp-opsexcellence.github.io/dalos-workspace-dev/':'https://daloshq.com/workspace/');   /* workspace: -dev on staging, prod on prod — resolved by host */
/* sidebar-footer icons + helpers */
/* Workspace icon — 3x3 apps/dot grid (per Tarek's reference) */
var ICON_WS='<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.4" y="1.4" width="3.4" height="3.4" rx=".8"/><rect x="6.3" y="1.4" width="3.4" height="3.4" rx=".8"/><rect x="11.2" y="1.4" width="3.4" height="3.4" rx=".8"/><rect x="1.4" y="6.3" width="3.4" height="3.4" rx=".8"/><rect x="6.3" y="6.3" width="3.4" height="3.4" rx=".8"/><rect x="11.2" y="6.3" width="3.4" height="3.4" rx=".8"/><rect x="1.4" y="11.2" width="3.4" height="3.4" rx=".8"/><rect x="6.3" y="11.2" width="3.4" height="3.4" rx=".8"/><rect x="11.2" y="11.2" width="3.4" height="3.4" rx=".8"/></svg>';
var ICON_OUT1='M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z';
var ICON_OUT2='M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z';
function initials(name){ var p=(name||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '—'; return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function roleLabel(r){ if(!r) return ''; r=String(r).replace(/_/g,' '); return r.charAt(0).toUpperCase()+r.slice(1); }
function goWorkspace(){ window.location.href=WORKSPACE_URL; }
/* Deliberate sign-out. Shared token → signs out of all DalOS apps (same as Vision's button),
   then back to the Workspace login. */
function signOut(){ var go=function(){ window.location.href=WORKSPACE_URL; }; try{ supabase.auth.signOut().then(go).catch(go); }catch(e){ go(); } }

/* Shared idle heartbeat key — keep the shared session alive like the other apps.
   We only WRITE it (good citizen); we never enforce a timeout here (that is what
   caused the cross-app sign-out bug). See dalos-shared-auth-signouts. */
var DALOS_ACTIVITY_KEY='dalos_last_activity';
function touchActivity(){ try{ localStorage.setItem(DALOS_ACTIVITY_KEY, String(Date.now())); }catch(e){} }

/* ════════════════════════════════════════════════════════════════════════════
   QC-PREVIEW MODALS — ported VERBATIM from dalos-vision index.html (13567–14022).
   No behaviour change. They depend only on `ce`, `useState`, `supabase`, `config`.
   ════════════════════════════════════════════════════════════════════════════ */
function loadInspPreview(id,setPopup,config){
  setPopup({id:id,loading:true,data:null});
  supabase.from('inspections_with_aggregates').select('id,date,packhouse_id,variety_id,decision,status,avg_brix,avg_total_defect,has_critical,live_avg_total_defect,live_avg_brix').eq('id',id).single().then(function(ir){

/* ════════════════════════════════════════════════════════════════════════════
   CONFIG LOADER — replicates the modal-relevant slice of Vision's loadConfigFromDB
   (id→name maps + cqcDefectSections). crm.js itself does NOT read config; this is
   ONLY to make the ported QC-preview modals render byte-identically. Also resolves
   the DB-active season for CRM.init.
   ════════════════════════════════════════════════════════════════════════════ */
function loadCommercialConfig(){
  return Promise.all([
    supabase.from('packhouses').select('*').eq('active',true).order('name'),
    supabase.from('products').select('*').eq('active',true).order('name'),
    supabase.from('varieties').select('*').order('name'),
    supabase.from('clients').select('*').order('name'),
    supabase.from('sub_clients').select('*').eq('active',true).order('name'),
    supabase.from('countries').select('*').order('name'),
    supabase.from('farms').select('*').order('name'),
    supabase.from('classes').select('*').order('name'),
    supabase.from('carton_types').select('*').order('name'),
    supabase.from('seasons').select('*').order('name'),
    supabase.from('categories').select('*').eq('active',true).order('name'),
    supabase.from('cqc_defect_sections').select('*, cqc_defects(*)').eq('active',true).order('display_order')
  ]).then(function(results){
    var phs=results[0].data||[], prods=results[1].data||[], vars=results[2].data||[];
    var clients=results[3].data||[], subClients=results[4].data||[], countries=results[5].data||[];
    var farms=results[6].data||[], classes=results[7].data||[], cartonTypes=results[8].data||[];
    var seasons=results[9].data||[], categories=results[10].data||[], cqcSectionsRaw=results[11].data||[];

    var categoriesIdToName={};
    categories.forEach(function(c){categoriesIdToName[c.id]=c.name;});

    var varietiesIdToName={}, varietiesFull={};
    vars.forEach(function(v){
      varietiesIdToName[v.id]=v.name;
      if(v.active===false) return;
      if(!varietiesFull[v.product_id]) varietiesFull[v.product_id]=[];
      varietiesFull[v.product_id].push({id:v.id,name:v.name,categoryId:v.category_id||null});
    });

    var clientsIdToName={};
    clients.forEach(function(c){clientsIdToName[c.id]=c.name;});

    var classesIdToName={};
    classes.forEach(function(c){classesIdToName[c.id]=c.name;});

    var countriesIdToName={};
    countries.forEach(function(c){countriesIdToName[c.id]=c.name;});

    var farmsIdToName={};
    farms.forEach(function(f){farmsIdToName[f.id]=f.name;});

    var cartonTypesIdToName={};
    cartonTypes.forEach(function(c){cartonTypesIdToName[c.id]=c.name;});

    var mappedPH=phs.map(function(p){ return {id:p.id, name:p.name}; });
    var mappedProds=prods.map(function(p){ return {id:p.id, name:p.name}; });

    var cqcDefectSections=(function(){
      var map={};
      cqcSectionsRaw.forEach(function(sec){
        if(!map[sec.product_id]) map[sec.product_id]=[];
        map[sec.product_id].push({
          dbId:sec.id, section:sec.name, color:sec.color||'#3a7a4a',
          items:(sec.cqc_defects||[]).sort(function(a,b){return a.display_order-b.display_order;}).map(function(d){
            return {dbId:d.id,key:d.key,en:d.name_en,ar:d.name_ar||'',sev:d.severity};
          })
        });
      });
      return map;
    })();

    var activeSeason=seasons.find(function(s){return s.active;})||seasons[0]||null;

    var config={
      packhouses:mappedPH,
      products:mappedProds,
      varietiesIdToName:varietiesIdToName,
      varietiesFull:varietiesFull,
      categoriesIdToName:categoriesIdToName,
      clientsIdToName:clientsIdToName,
      classesIdToName:classesIdToName,
      countriesIdToName:countriesIdToName,
      farmsIdToName:farmsIdToName,
      cartonTypesIdToName:cartonTypesIdToName,
      cartonTypes:cartonTypes.map(function(c){return c.name;}),
      subClients:subClients.map(function(s){return {id:s.id,name:s.name,clientId:s.client_id,isPrimary:s.is_primary!==false};}),
      seasons:seasons.map(function(s){return {id:s.id,name:s.name,active:s.active};}),
      cqcDefectSections:cqcDefectSections,
      _loaded:true
    };
    return {config:config, seasonId:activeSeason?activeSeason.id:null};
  });
}

   bar tracks the active view. Tabs → CRM.setTab; lead sub-views → CRM.leadNav.
   #capture keeps its own token-aware handler in the mount effect below. ── */
var NAV_ROUTES={

  shipments:{kind:'tab',id:'shipments'},
  invoices:{kind:'tab',id:'invoices'},
  claims:{kind:'tab',id:'claims'},

/* reverse: active (tab,leadKey) → slug, so onTab can keep the URL in sync even
   for in-content navigation (e.g. a KPI card that calls CRM.setTab directly). */
function crmSlugFor(tab,key){
  key=key||'';
  for(var s in NAV_ROUTES){ var r=NAV_ROUTES[s];
    if(r.kind==='lead'&&r.dest===tab&&(r.key||'')===key) return s;
    if(r.kind==='tab'&&r.id===tab) return s;
  }
  if(tab==='leads') return 'workspace';
  if(tab==='inbox') return 'inbox';
  if(tab==='funnel') return 'funnel';
  if(tab==='campaigns') return 'campaigns';
  return null;
}
/* Applies a route to crm.js. NOTE: at boot the target view can throw mid-render (data not
   loaded yet) — currentTab is still set, so crm.js re-renders it correctly once data arrives.
   The host owns the sidebar highlight directly (see boot block), so it does not depend on
   crm.js's ON_TAB firing here. */
function crmRouteApply(slug){
  var r=NAV_ROUTES[slug]; if(!r||!window.CRM) return false;
  try{ if(r.kind==='tab'){ (window.CRM.openTab||window.CRM.setTab)(r.id); } else { window.CRM.leadNav(r.dest,r.key); } }
  catch(e){ return false; }
  return true;
}
/* set the host's React highlight state for a slug, independent of crm.js's ON_TAB */
function crmMirrorState(slug,setTabState,setLeadState){
  var r=NAV_ROUTES[slug]; if(!r) return;
  if(r.kind==='tab'){ setTabState(r.id); setLeadState(''); }
  else { setTabState(r.dest); setLeadState(r.key||''); }
}

        ce('td',{style:{textAlign:'center',padding:'8px 6px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}},
          ce('div',{style:Object.assign({},mono,{fontSize:14,fontWeight:600,color:'var(--accent2)'})},u.total.toLocaleString())));
    });
    body=ce('div',{style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r2)',overflow:'hidden'}},
      ce('div',{style:{overflowX:'auto'}},
        ce('table',{style:{borderCollapse:'collapse',width:'100%',minWidth:920,fontSize:13}},thead,ce('tbody',null,rows))),
      ce('div',{style:{padding:'10px 16px',fontSize:11.5,color:'var(--text3)',background:'var(--bg2)',borderTop:'1px solid var(--border)'}},
        'Counts are page opens; “last” is time since the most recent visit. Empty cell = never visited. Leads sub-views are rolled up.'));
  }
  return ce('div',{className:'cm-content',style:{flex:1,minWidth:0,minHeight:0,overflowY:'auto',overflowX:'hidden',padding:'26px 30px'}},head,body);
}

/* Growth-pipeline brand mark — TRANSPARENT (no tile, no radial glow), so it reads as
   clean vector art on the aubergine chrome instead of a pasted-on box. Reused in the
   sidebar lockup + boot/gate. Light-violet inks for contrast on the dark aubergine. */
var SYMBOL_SVG='<svg width="100%" height="100%" viewBox="4 4 56 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 44 L25 36 L37 40 L53 17" stroke="#c9b6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#a98bff"><circle cx="11" cy="44" r="3"/><circle cx="25" cy="36" r="3"/><circle cx="37" cy="40" r="3"/></g><circle cx="53" cy="17" r="5.2" fill="#e2d7ff"/></svg>';

/* Simple boot / gate screens */
function Boot(props){
  return ce('div',{className:'boot'},
    ce('span',{className:'boot-mark','aria-hidden':'true',dangerouslySetInnerHTML:{__html:SYMBOL_SVG}}),
    ce('div',{className:'boot-logo'},'Dal',ce('span',{className:'os'},'OS'),' Commercial'),
    ce('div',{className:'boot-spin'}),
    ce('div',{className:'boot-sub'},props.msg||'Loading…')
  );
}
/* Map a Supabase auth error to a human line without leaking internals. */
function friendlyAuthError(e){
  var m=((e&&e.message)||'').toLowerCase();
  if(m.indexOf('invalid login')>-1||m.indexOf('credentials')>-1) return 'Incorrect email or password.';
  if(m.indexOf('email not confirmed')>-1) return 'Your email is not confirmed yet. Contact an administrator.';
  if(m.indexOf('rate')>-1) return 'Too many attempts. Wait a moment and try again.';
  return (e&&e.message)||'Sign-in failed. Please try again.';
}
function Gate(props){
  var sEmail=useState(''), email=sEmail[0], setEmail=sEmail[1];
  var sPw=useState(''), pw=sPw[0], setPw=sPw[1];
  var sBusy=useState(false), busy=sBusy[0], setBusy=sBusy[1];
  var sErr=useState(''), err=sErr[0], setErr=sErr[1];
  function submit(e){
    if(e&&e.preventDefault) e.preventDefault();
    if(busy) return;
    var em=(email||'').trim();
    if(!em||!pw){ setErr('Enter your email and password.'); return; }
    setBusy(true); setErr('');
    /* Same shared client / storageKey — writes the one shared session, never a new client. */
    supabase.auth.signInWithPassword({email:em,password:pw}).then(function(res){
      if(res.error){ setBusy(false); setErr(friendlyAuthError(res.error)); return; }
      /* Hand back to App: re-run the boot chain (role/season) which lands on #capture. */
      props.onSignedIn&&props.onSignedIn();
    }).catch(function(){ setBusy(false); setErr('Could not reach the server. Please retry.'); });
  }
  var canLogin=props.canLogin;
  return ce('div',{className:'boot'},
    ce('form',{className:'boot-card',onSubmit:submit},
      ce('span',{className:'boot-mark',style:{margin:'0 auto 14px'},'aria-hidden':'true',dangerouslySetInnerHTML:{__html:SYMBOL_SVG}}),
      ce('div',{className:'boot-logo',style:{fontSize:22}},'Dal',ce('span',{className:'os'},'OS'),' Commercial'),
      ce('div',{className:'boot-sub',style:{marginTop:canLogin?10:12,lineHeight:1.6}},props.msg),
      canLogin&&ce('input',{key:'em',className:'boot-inp',type:'email',placeholder:'you@daltexcorp.com',autoComplete:'username',autoCapitalize:'none',spellCheck:false,value:email,disabled:busy,onChange:function(e){setEmail(e.target.value);}}),
      canLogin&&ce('input',{key:'pw',className:'boot-inp',type:'password',placeholder:'Password',autoComplete:'current-password',value:pw,disabled:busy,onChange:function(e){setPw(e.target.value);}}),
      canLogin&&err&&ce('div',{key:'er',className:'boot-err'},err),
      canLogin&&ce('button',{key:'bt',className:'boot-signin',type:'submit',disabled:busy},busy?'Signing in…':'Sign in'),
      canLogin&&ce('a',{key:'fg',className:'boot-forgot',href:WORKSPACE_URL},'Forgot password?'),
      (canLogin||props.showSignIn)&&ce('a',{key:'ws',className:'boot-ws',href:WORKSPACE_URL},'Open the full DalOS Workspace instead →')
    )
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   App — auth bootstrap (shared session) → perms gate → config/season → mount CRM.
   Mirrors Vision's getSession→users→userObj→perms chain.
   ════════════════════════════════════════════════════════════════════════════ */
/* Roles allowed into Commercial — EXACTLY Vision's perms.viewCRM grants
   (index.html ROLES): only admin, power_user, commercial. board/qc_manager/
   executive/etc. do NOT have viewCRM in Vision, so they are denied here too. */
var ROLE_VIEW_CRM={admin:1,power_user:1,commercial:1,marketing:1};
/* Per-role CRM/leads permissions. The ROLE is assigned in Vision's Admin (writes users.role to the
   shared DB, to move to Workspace later); this app READS that role and enforces the grants below.
   Mirror of Vision's ROLES perms for the CRM/leads keys. Pass 1: UI gating; RLS/RPC is pass 2. */
var CRM_PERMS={
  admin:      {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:1},
  power_user: {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:1},
  commercial: {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:1},
  marketing:  {viewCRM:1,editCRM:0,viewLeads:1,editLeadStatus:1,manageLeads:1}
};

function App(){
  var sState=useState({phase:'boot',msg:'Signing in…'});
  var state=sState[0], setState=sState[1];

  /* Boot chain: resolve the shared session → role/season → ready. Also re-run after an
     in-gate sign-in; the URL hash (e.g. #capture from the installed PWA) is untouched, so
     CRMHost's mount effect deep-links straight into Show Mode. */
  function bootstrap(){
    touchActivity();
    supabase.auth.getSession().then(function(res){
      var session=res.data&&res.data.session;
      if(!session||!session.user){
        setState({phase:'gate',msg:'Sign in to open DalOS Commercial.',canLogin:true});
        return;
      }
      var authUser=session.user;
      supabase.from('users').select('*').eq('id',authUser.id).single().then(function(pr){
        var u=pr.data;
        if(!u||!u.active){
          setState({phase:'gate',msg:'Your account is not active. Contact an administrator.',showSignIn:false});
          return;
        }
        if(!ROLE_VIEW_CRM[u.role]){
          setState({phase:'gate',msg:'Your role ('+(u.role||'unknown')+') does not have access to DalOS Commercial.',showSignIn:false});
          return;
        }
        var currentUser={id:u.id,name:u.full_name,email:u.email,role:u.role};
        var isAdmin=(u.role==='admin'||u.role==='power_user');
        var perms=CRM_PERMS[u.role]||{};
        setState({phase:'boot',msg:'Loading commercial data…'});
        loadCommercialConfig().then(function(out){
          if(!out.seasonId){
            setState({phase:'gate',msg:'No active season is configured. Contact an administrator.',showSignIn:false});
            return;
          }
          setState({phase:'ready',currentUser:currentUser,isAdmin:isAdmin,perms:perms,config:out.config,seasonId:out.seasonId});
        }).catch(function(e){
          setState({phase:'gate',msg:'Could not load commercial data. Please retry. ('+((e&&e.message)||'error')+')',showSignIn:false});
        });
      }).catch(function(){
        setState({phase:'gate',msg:'Could not verify your account. Please retry.',showSignIn:false});
      });
    }).catch(function(){
      setState({phase:'gate',msg:'Could not reach the server. Sign in to retry.',canLogin:true});
    });
  }
  React.useEffect(bootstrap,[]);

  /* Fade the pre-mount branded splash once we've resolved to the app or a gate screen —
     but keep it up for ~1.5s min so the loading animation plays at least one full cycle
     even when a cached session resolves instantly. */
  React.useEffect(function(){
    if(state.phase!=='ready'&&state.phase!=='gate') return;
    var sp=document.getElementById('cm-splash'); if(!sp) return;
    var elapsed=(window.performance&&performance.now)?performance.now():1500;
    var wait=Math.max(0,1500-elapsed);
    var t=setTimeout(function(){ sp.style.opacity='0'; setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },480); },wait);
    return function(){ clearTimeout(t); };
  },[state.phase]);

  if(state.phase==='boot') return ce(Boot,{msg:state.msg});
  if(state.phase==='gate') return ce(Gate,{msg:state.msg,showSignIn:state.showSignIn,canLogin:state.canLogin,onSignedIn:function(){ setState({phase:'boot',msg:'Signing in…'}); bootstrap(); }});
  return ce(CRMHost,{currentUser:state.currentUser,isAdmin:state.isAdmin,perms:state.perms,config:state.config,seasonId:state.seasonId});
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));

/* ── Service worker: precache the app shell + self-hosted capture libs and
   runtime-cache everything else, so Show Mode survives dead venue wifi once
   loaded (home-screen install + #capture deep link). Registered relative to
   the page so its scope is the GitHub Pages subpath. Never touches Supabase. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  });
}
</script>
</body>
</html>
