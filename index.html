<title>DalOS Commercial</title>
<meta name="theme-color" content="#1e2d22"/>

     into Show Mode; apple-* meta give standalone display + icon. -->
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="capture-icon-180.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="capture-icon-152.png"/>
<link rel="apple-touch-icon" sizes="167x167" href="capture-icon-167.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="capture-icon-180.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DalOS Capture"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── Palette: PEWTER — dimmed daylight (muted lavender-gray content, dark-violet
   sidebar, violet accent). Feeds boot/gate, html/body, and the QC-preview modals
   (which render outside .crmv). CRM island + sidebar via the .crmv.crmv block below. ── */
:root{
  --bg:#d9d6e0;--bg2:#cfccda;--bg3:#c4c1d1;
  --sidebar:#2f2a3d;--sidebar2:#3a3449;
  --sidebar-text:#d9d3ea;--sidebar-muted:#9a92b0;
  --accent:#7c4dff;--accent2:#6a3ded;
  --amber:#b7791f;--amber-bg:rgba(183,121,31,.15);--amber-border:rgba(183,121,31,.42);
  --red:#d64545;--red-bg:rgba(214,69,69,.14);--red-border:rgba(214,69,69,.42);
  --green:#1f9d55;--green-bg:rgba(31,157,85,.15);--green-border:rgba(31,157,85,.42);
  --text:#221f2b;--text2:#4c4757;--text3:#6f6a7c;
  --border:#c8c4d3;--border2:#b8b3c6;--card:#efedf4;
  --font-display:'DM Serif Display',serif;
  --font-body:'Instrument Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --sidebar-w:218px;
}
html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font-body);font-size:13px;color:var(--text)}

/* ── QC-preview modal support (ported verbatim from Vision) ── */
@keyframes dalos-spin{to{transform:rotate(360deg)}}
.dalos-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:dalos-spin .8s linear infinite;vertical-align:middle}
.cqc-two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cqc-two-col-bot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){ .cqc-two-col,.cqc-two-col-bot{grid-template-columns:1fr} }
/* Mobile: off-canvas sidebar + hamburger (desktop is unaffected) */
.cm-burger{display:none;position:fixed;top:9px;left:9px;z-index:1001;width:40px;height:40px;align-items:center;justify-content:center;background:var(--sidebar);color:#fff;border:1px solid var(--sidebar2);border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.28);cursor:pointer;padding:0}
.cm-burger svg{width:20px;height:20px;display:block}
.cm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999}
@media(max-width:767px){
  /* crm.js hides .sidebar at ≤700px (its own standalone mobile layout) — the Commercial host
     needs it, so force it back with !important and slide it in/out off-canvas. */
  .crmv .sidebar{display:flex !important;position:fixed !important;left:0;top:0;bottom:0;height:100dvh !important;width:min(82vw,300px) !important;z-index:1000;transform:translateX(-100%) !important;transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.45)}
  .crmv .sidebar.mob-open{transform:translateX(0) !important}
  .cm-burger{display:flex}
  .cm-content{padding-top:52px}
}
/* CqcPreviewModal skeleton reuses this global keyframe (also defined by injectCrmCss) */
@keyframes dh-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ── shared canonical staging badge (crm.js nav renders <span class="staging-badge">) ── */
.staging-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#ff6b35 0%,#f7c948 100%);color:#fff;padding:4px 12px 4px 9px;border-radius:20px;box-shadow:0 3px 14px rgba(255,107,53,.4);font-size:10px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.18em;text-transform:uppercase}

/* ── boot / gate screens ── */
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);padding:24px;text-align:center}
.boot-logo{font-family:var(--font-display);font-size:26px;color:var(--text)}
.boot-logo .os{color:var(--accent)}
.boot-sub{font-size:12px;color:var(--text3);letter-spacing:.04em}
.boot-spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:dalos-spin .8s linear infinite}
.boot-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:26px 30px;max-width:380px;box-shadow:0 8px 30px rgba(26,26,23,.08)}
.boot-btn{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:8px;text-decoration:none}
.boot-btn:hover{background:var(--accent2)}

/* ═══════════════ PEWTER RESKIN of the CRM island ═══════════════
   crm.js is fully CSS-variable-driven, so we override its .crmv vars here rather
   than editing crm.js (kept byte-identical). Double-class .crmv.crmv beats the
   specificity/order of crm.js's injected .crmv{} block. Same palette as :root. */
.crmv.crmv{
  --bg:#d9d6e0;--bg2:#cfccda;--bg3:#c4c1d1;
  --sidebar:#2f2a3d;--sidebar2:#3a3449;
  --sidebar-text:#d9d3ea;--sidebar-muted:#9a92b0;
  --accent:#7c4dff;--accent2:#6a3ded;
  --amber:#b7791f;--amber-bg:rgba(183,121,31,.15);--amber-border:rgba(183,121,31,.42);
  --red:#d64545;--red-bg:rgba(214,69,69,.14);--red-border:rgba(214,69,69,.42);
  --green:#1f9d55;--green-bg:rgba(31,157,85,.15);--green-border:rgba(31,157,85,.42);
  --text:#221f2b;--text2:#4c4757;--text3:#6f6a7c;
  --border:#c8c4d3;--border2:#b8b3c6;--card:#efedf4;
}
/* consolidated Lead-Generation nav: Marketing/Sales sub-labels + My Work count badge */
.crmv .nav-sublabel{padding-top:8px;padding-bottom:3px;opacity:.9}
.crmv .nav-item .nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:10px;line-height:16px;min-width:16px;text-align:center;background:var(--red);color:#fff;border-radius:9px;padding:0 6px}
.crmv .nav-item.active .nav-badge{background:rgba(255,255,255,.28);color:#fff}
/* Hardcoded-white Leads/Capture surfaces in crm.js → dark panels (var flip can't reach them) */
.crmv.crmv .ldp,.crmv.crmv .lc,.crmv.crmv .inb,.crmv.crmv .capbtn,.crmv.crmv .capchip,.crmv.crmv .cap-bt,.crmv.crmv .who{background:var(--card)}
.crmv.crmv .col-n{background:var(--bg3);color:var(--text2)}
.crmv.crmv .fbtn.active .fbtn-count{background:var(--accent);color:#fff}
.crmv.crmv .l-bulk .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* amber info banners: dark-amber text on a light amber tint */
.crmv.crmv .alert-warn{background:rgba(183,121,31,.12);border-color:rgba(183,121,31,.35);color:#8a5a12}
.crmv.crmv .l-draft{color:#8a5a12}

/* ── sidebar footer: Workspace button · user card · Sign out · version ── */
.crmv .cm-foot{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.crmv .cm-ws{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:9px;background:transparent;border:1px solid var(--border2);color:var(--sidebar-text);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;text-align:left}
.crmv .cm-ws:hover{background:var(--sidebar2);border-color:color-mix(in srgb,var(--accent) 55%,var(--border2))}
.crmv .cm-ws-ic{display:inline-flex;align-items:center;flex-shrink:0}
.crmv .cm-ws svg{width:15px;height:15px;opacity:.78;flex-shrink:0}
.crmv .cm-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.crmv .cm-av{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em}
.crmv .cm-name{font-size:13px;font-weight:600;color:var(--sidebar-text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crmv .cm-role{font-size:11px;color:var(--sidebar-muted);margin-top:1px}
.crmv .cm-signout{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:9px;background:transparent;border:none;color:var(--sidebar-text);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:.15s;text-align:left}
.crmv .cm-signout:hover{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.crmv .cm-signout svg{width:14px;height:14px;opacity:.72;flex-shrink:0}
.crmv .cm-ver{font-size:10px;color:var(--sidebar-muted);padding:3px 4px 0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

/* ════════════════════════════════════════════════════════════════════════════
   CONFIG LOADER — replicates the modal-relevant slice of Vision's loadConfigFromDB
   (id→name maps + cqcDefectSections). crm.js itself does NOT read config; this is
   ONLY to make the ported QC-preview modals render byte-identically. Also resolves
   the DB-active season for CRM.init.
   ════════════════════════════════════════════════════════════════════════════ */
function loadCommercialConfig(){
  return Promise.all([
    supabase.from('packhouses').select('*').eq('active',true).order('name'),
    supabase.from('products').select('*').eq('active',true).order('name'),
    supabase.from('varieties').select('*').order('name'),
    supabase.from('clients').select('*').order('name'),
    supabase.from('sub_clients').select('*').eq('active',true).order('name'),
    supabase.from('countries').select('*').order('name'),
    supabase.from('farms').select('*').order('name'),
    supabase.from('classes').select('*').order('name'),
    supabase.from('carton_types').select('*').order('name'),
    supabase.from('seasons').select('*').order('name'),
    supabase.from('categories').select('*').eq('active',true).order('name'),
    supabase.from('cqc_defect_sections').select('*, cqc_defects(*)').eq('active',true).order('display_order')
  ]).then(function(results){
    var phs=results[0].data||[], prods=results[1].data||[], vars=results[2].data||[];
    var clients=results[3].data||[], subClients=results[4].data||[], countries=results[5].data||[];
    var farms=results[6].data||[], classes=results[7].data||[], cartonTypes=results[8].data||[];
    var seasons=results[9].data||[], categories=results[10].data||[], cqcSectionsRaw=results[11].data||[];

    var categoriesIdToName={};
    categories.forEach(function(c){categoriesIdToName[c.id]=c.name;});

    var varietiesIdToName={}, varietiesFull={};
    vars.forEach(function(v){
      varietiesIdToName[v.id]=v.name;
      if(v.active===false) return;
      if(!varietiesFull[v.product_id]) varietiesFull[v.product_id]=[];
      varietiesFull[v.product_id].push({id:v.id,name:v.name,categoryId:v.category_id||null});
    });

    var clientsIdToName={};
    clients.forEach(function(c){clientsIdToName[c.id]=c.name;});

    var classesIdToName={};
    classes.forEach(function(c){classesIdToName[c.id]=c.name;});

    var countriesIdToName={};
    countries.forEach(function(c){countriesIdToName[c.id]=c.name;});

    var farmsIdToName={};
    farms.forEach(function(f){farmsIdToName[f.id]=f.name;});

    var cartonTypesIdToName={};
    cartonTypes.forEach(function(c){cartonTypesIdToName[c.id]=c.name;});

    var mappedPH=phs.map(function(p){ return {id:p.id, name:p.name}; });
    var mappedProds=prods.map(function(p){ return {id:p.id, name:p.name}; });

    var cqcDefectSections=(function(){
      var map={};
      cqcSectionsRaw.forEach(function(sec){
        if(!map[sec.product_id]) map[sec.product_id]=[];
        map[sec.product_id].push({
          dbId:sec.id, section:sec.name, color:sec.color||'#3a7a4a',
          items:(sec.cqc_defects||[]).sort(function(a,b){return a.display_order-b.display_order;}).map(function(d){
            return {dbId:d.id,key:d.key,en:d.name_en,ar:d.name_ar||'',sev:d.severity};
          })
        });
      });
      return map;
    })();

    var activeSeason=seasons.find(function(s){return s.active;})||seasons[0]||null;

    var config={
      packhouses:mappedPH,
      products:mappedProds,
      varietiesIdToName:varietiesIdToName,
      varietiesFull:varietiesFull,
      categoriesIdToName:categoriesIdToName,
      clientsIdToName:clientsIdToName,
      classesIdToName:classesIdToName,
      countriesIdToName:countriesIdToName,
      farmsIdToName:farmsIdToName,
      cartonTypesIdToName:cartonTypesIdToName,
      cartonTypes:cartonTypes.map(function(c){return c.name;}),
      subClients:subClients.map(function(s){return {id:s.id,name:s.name,clientId:s.client_id,isPrimary:s.is_primary!==false};}),
      seasons:seasons.map(function(s){return {id:s.id,name:s.name,active:s.active};}),
      cqcDefectSections:cqcDefectSections,
      _loaded:true
    };
    return {config:config, seasonId:activeSeason?activeSeason.id:null};
  });
}

   #campaigns, #capture, …) so any tab is bookmarkable / shareable and the address
   bar tracks the active view. Tabs → CRM.setTab; lead sub-views → CRM.leadNav.
   #capture keeps its own token-aware handler in the mount effect below. ── */
var NAV_ROUTES={
  dashboard:{kind:'tab',id:'dashboard'},
  shipments:{kind:'tab',id:'shipments'},
  invoices:{kind:'tab',id:'invoices'},
  claims:{kind:'tab',id:'claims'},
  redirects:{kind:'tab',id:'redirects'},

/* reverse: active (tab,leadKey) → slug, so onTab can keep the URL in sync even
   for in-content navigation (e.g. a KPI card that calls CRM.setTab directly). */
function crmSlugFor(tab,key){
  key=key||'';
  for(var s in NAV_ROUTES){ var r=NAV_ROUTES[s];
    if(r.kind==='lead'&&r.dest===tab&&(r.key||'')===key) return s;
    if(r.kind==='tab'&&r.id===tab) return s;
  }
  if(tab==='leads') return 'workspace';
  if(tab==='inbox') return 'inbox';
  if(tab==='funnel') return 'funnel';
  if(tab==='campaigns') return 'campaigns';
  return null;
}
/* Applies a route to crm.js. NOTE: at boot the target view can throw mid-render (data not
   loaded yet) — currentTab is still set, so crm.js re-renders it correctly once data arrives.

   crm.js's ON_TAB firing here. */
function crmRouteApply(slug){
  var r=NAV_ROUTES[slug]; if(!r||!window.CRM) return false;
  try{ if(r.kind==='tab'){ (window.CRM.openTab||window.CRM.setTab)(r.id); } else { window.CRM.leadNav(r.dest,r.key); } }
  catch(e){ return false; }
  return true;
}

  var r=NAV_ROUTES[slug]; if(!r) return;

  else { setTabState(r.dest); setLeadState(r.key||''); }

/* ════════════════════════════════════════════════════════════════════════════
   App — auth bootstrap (shared session) → perms gate → config/season → mount CRM.
   Mirrors Vision's getSession→users→userObj→perms chain.
   ════════════════════════════════════════════════════════════════════════════ */
/* Roles allowed into Commercial — EXACTLY Vision's perms.viewCRM grants
   (index.html ROLES): only admin, power_user, commercial. board/qc_manager/
   executive/etc. do NOT have viewCRM in Vision, so they are denied here too. */
var ROLE_VIEW_CRM={admin:1,power_user:1,commercial:1,marketing:1};
/* Per-role CRM/leads permissions. The ROLE is assigned in Vision's Admin (writes users.role to the
   shared DB, to move to Workspace later); this app READS that role and enforces the grants below.
   Mirror of Vision's ROLES perms for the CRM/leads keys. Pass 1: UI gating; RLS/RPC is pass 2. */
var CRM_PERMS={
  admin:      {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:1},
  power_user: {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:1},
  commercial: {viewCRM:1,editCRM:1,viewLeads:1,editLeadStatus:1,manageLeads:0},
  marketing:  {viewCRM:1,editCRM:0,viewLeads:1,editLeadStatus:1,manageLeads:1}
};

function App(){
  var sState=useState({phase:'boot',msg:'Signing in…'});
  var state=sState[0], setState=sState[1];

  React.useEffect(function(){
    touchActivity();
    supabase.auth.getSession().then(function(res){
      var session=res.data&&res.data.session;
      if(!session||!session.user){
        setState({phase:'gate',msg:'You are not signed in. Sign in through DalOS Workspace, then reopen Commercial.',showSignIn:true});
        return;
      }
      var authUser=session.user;
      supabase.from('users').select('*').eq('id',authUser.id).single().then(function(pr){
        var u=pr.data;
        if(!u||!u.active){
          setState({phase:'gate',msg:'Your account is not active. Contact an administrator.',showSignIn:false});
          return;
        }
        if(!ROLE_VIEW_CRM[u.role]){
          setState({phase:'gate',msg:'Your role ('+(u.role||'unknown')+') does not have access to DalOS Commercial.',showSignIn:false});
          return;
        }
        var currentUser={id:u.id,name:u.full_name,email:u.email,role:u.role};
        var isAdmin=(u.role==='admin'||u.role==='power_user');
        var perms=CRM_PERMS[u.role]||{};
        setState({phase:'boot',msg:'Loading commercial data…'});
        loadCommercialConfig().then(function(out){
          if(!out.seasonId){
            setState({phase:'gate',msg:'No active season is configured. Contact an administrator.',showSignIn:false});
            return;
          }
          setState({phase:'ready',currentUser:currentUser,isAdmin:isAdmin,perms:perms,config:out.config,seasonId:out.seasonId});
        }).catch(function(e){
          setState({phase:'gate',msg:'Could not load commercial data. Please retry. ('+((e&&e.message)||'error')+')',showSignIn:false});
        });
      }).catch(function(){
        setState({phase:'gate',msg:'Could not verify your account. Please retry.',showSignIn:false});
      });
    }).catch(function(){
      setState({phase:'gate',msg:'Could not reach the server. Please retry.',showSignIn:true});
    });
  },[]);

  if(state.phase==='boot') return ce(Boot,{msg:state.msg});
  if(state.phase==='gate') return ce(Gate,{msg:state.msg,showSignIn:state.showSignIn});
  return ce(CRMHost,{currentUser:state.currentUser,isAdmin:state.isAdmin,perms:state.perms,config:state.config,seasonId:state.seasonId});
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));

/* ── Service worker: precache the app shell + self-hosted capture libs and
   runtime-cache everything else, so Show Mode survives dead venue wifi once
   loaded (home-screen install + #capture deep link). Registered relative to
   the page so its scope is the GitHub Pages subpath. Never touches Supabase. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  });
}
</script>
